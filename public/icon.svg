<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark slate-950 backdrop -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Outer Ring Shield Accent -->
  <rect x="32" y="32" width="448" height="448" rx="92" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="16 12" opacity="0.6" />

  <!-- Core Biomedical Cross & Wave Shield Symbol -->
  <g transform="translate(256, 236)" filter="url(#glow)">
    <!-- Glossy Rounded Shield -->
    <path d="M -90,-120 L 90,-120 L 90,0 Q 90,90 0,140 Q -90,90 -90,0 Z" fill="none" stroke="url(#shield-grad)" stroke-width="14" stroke-linejoin="round" />
    
    <!-- Medical Heartbeat Line and Pulse Crossing -->
    <path d="M -70,0 L -35,0 L -25,-30 L -15,40 L -5,-55 L 5,30 L 12,-15 L 20,0 L 70,0" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Dynamic clinical green/teal power node at center -->
    <circle cx="12" cy="-15" r="8" fill="#2dd4bf" />
  </g>

  <!-- Title Badge Label in Space Grotesk Style -->
  <text x="256" y="445" font-family="'Inter', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="6" fill="#f8fafc" text-anchor="middle">BEMMS</text>
  <text x="256" y="475" font-family="'JetBrains Mono', monospace" font-size="14" font-style="normal" font-weight="500" letter-spacing="4" fill="#64748b" text-anchor="middle">ST. JUDE'S</text>
</svg>
